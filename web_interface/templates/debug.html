{% extends "base.html" %}

{% block title %}Debug - Safety Detector{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-bug text-warning"></i>
            Debug & Test Interface
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-camera"></i> Camera Test</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" id="testCameraBtn">Test Camera Access</button>
                <div id="cameraTest" class="mt-3"></div>
                <video id="testVideo" style="width: 100%; display: none;" autoplay></video>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-download"></i> Download Test</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-success" id="testDownloadBtn">Test Report Download</button>
                <div id="downloadTest" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-code"></i> JavaScript Console</h5>
            </div>
            <div class="card-body">
                <div id="consoleOutput" style="background: #000; color: #0f0; padding: 15px; font-family: monospace; height: 300px; overflow-y: auto;">
                    Console output will appear here...
                </div>
                <button class="btn btn-secondary mt-2" id="clearConsoleBtn">Clear Console</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const consoleOutput = document.getElementById('consoleOutput');
    
    // Override console.log to show in our debug interface
    const originalLog = console.log;
    const originalError = console.error;
    
    function addToConsole(message, type = 'log') {
        const timestamp = new Date().toLocaleTimeString();
        const color = type === 'error' ? '#f00' : '#0f0';
        consoleOutput.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }
    
    console.log = function(...args) {
        addToConsole(args.join(' '), 'log');
        originalLog.apply(console, args);
    };
    
    console.error = function(...args) {
        addToConsole('ERROR: ' + args.join(' '), 'error');
        originalError.apply(console, args);
    };
    
    // Test camera access
    document.getElementById('testCameraBtn').addEventListener('click', function() {
        console.log('Testing camera access...');
        
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function(stream) {
                console.log('Camera access successful!');
                document.getElementById('cameraTest').innerHTML = '<div class="alert alert-success">✅ Camera access granted</div>';
                
                const video = document.getElementById('testVideo');
                video.srcObject = stream;
                video.style.display = 'block';
                
                // Stop stream after 5 seconds
                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                    video.style.display = 'none';
                    console.log('Camera stream stopped');
                }, 5000);
            })
            .catch(function(error) {
                console.error('Camera access failed:', error);
                document.getElementById('cameraTest').innerHTML = `<div class="alert alert-danger">❌ Camera access failed: ${error.message}</div>`;
            });
    });
    
    // Test download functionality
    document.getElementById('testDownloadBtn').addEventListener('click', function() {
        console.log('Testing download functionality...');
        
        try {
            const testData = 'This is a test report file generated by Safety Detector Debug Interface.';
            const blob = new Blob([testData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test_report_${new Date().getTime()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            console.log('Download test successful!');
            document.getElementById('downloadTest').innerHTML = '<div class="alert alert-success">✅ Download functionality working</div>';
        } catch (error) {
            console.error('Download test failed:', error);
            document.getElementById('downloadTest').innerHTML = `<div class="alert alert-danger">❌ Download failed: ${error.message}</div>`;
        }
    });
    
    // Clear console
    document.getElementById('clearConsoleBtn').addEventListener('click', function() {
        consoleOutput.innerHTML = 'Console cleared...<br>';
    });
    
    console.log('Debug interface loaded successfully');
    console.log('Browser:', navigator.userAgent);
    console.log('Available cameras:', navigator.mediaDevices ? 'Supported' : 'Not supported');
});
</script>
{% endblock %}
